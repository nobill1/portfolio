[build]
command = "npm run build"
publish = "out"

[build.environment]
NODE_VERSION = "22"
# Static export (output: 'export') publishes `out` as-is. The auto-installed
# Next.js runtime copies .next/static into `out` too and fails on the clash.
NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200